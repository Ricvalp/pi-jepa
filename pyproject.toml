[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-jepa-cartpole"
version = "0.1.0"
description = "Physics-informed JEPA experiments on rendered cart-pole trajectories"
readme = "README.md"
requires-python = ">=3.11.15,<3.12"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pillow==12.3.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
tracking = ["wandb==0.30.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = ["integration: explicitly requested integration checks, including the offline W&B SDK"]
